# Snippet de Nginx para servir Gold Signals en https://desarrollaunbyte.com/gold/
# Incluir dentro del bloque server { ... } SSL (puerto 443) de desarrollaunbyte.com

location = /gold {
    return 301 /gold/;
}

location ^~ /gold/ {
    proxy_pass http://127.0.0.1:8010/gold/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
